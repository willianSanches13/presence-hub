<div class="mat-elevation-z4">
    <table mat-table [dataSource]="workshops">
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>Id</th>
            <td mat-cell *matCellDef="let row">{{row.id}}</td>
        </ng-container>

        <ng-container matColumnDef="titulo">
            <th mat-header-cell *matHeaderCellDef>Título</th>
            <td mat-cell *matCellDef="let row">{{row.titulo}}</td>
        </ng-container>

        <ng-container matColumnDef="descricao">
            <th mat-header-cell *matHeaderCellDef>Descrição</th>
            <td mat-cell *matCellDef="let row">{{row.descricao}}</td>
        </ng-container>

        <ng-container matColumnDef="data">
            <th mat-header-cell *matHeaderCellDef>Data</th>
            <td mat-cell *matCellDef="let row">{{row.data | date}}</td>
        </ng-container>

        <ng-container matColumnDef="professorNome">
            <th mat-header-cell *matHeaderCellDef>Professor</th>
            <td mat-cell *matCellDef="let row">{{row.professor.nome}}</td>
        </ng-container>


        <ng-container matColumnDef="registroPresenca">
            <th mat-header-cell *matHeaderCellDef>Chamada</th>
            <td mat-cell *matCellDef="let row">
                <a *ngIf="!row.certificadosGerados" routerLink="/workshops/presenca/{{ row.id }}" class="assignment">
                    <i class="material-icons">
                        assignment
                    </i>
                </a>
                <i *ngIf="row.certificadosGerados" class="material-icons check-circle">
                    check_circle
                </i>
            </td>
        </ng-container>

        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>Ações</th>
            <td mat-cell *matCellDef="let row">
                <a routerLink="/workshops/details/{{ row.id }}" class="details">
                    <i class="material-icons">info</i>
                </a>
                <ng-container *ngIf="!row.certificadosGerados; else blockedIcon">
                    <a routerLink="/workshops/update/{{ row.id }}" class="edit">
                        <i class="material-icons">edit</i>
                    </a>
                    <a routerLink="/workshops/delete/{{ row.id }}" class="delete">
                        <i class="material-icons">delete</i>
                    </a>
                </ng-container>
                <ng-template #blockedIcon>
                    <i class="material-icons">block</i>
                </ng-template>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
