name: Deploy to GCP

on:
  push:
    branches:
      - master 

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build project
        run: |
          cd backend/presence-hub-back
          mvn clean package -DskipTests

      - name: Transfer JAR to GCP VM
        uses: appleboy/scp-action@v0.1.0
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          source: "backend/presence-hub-back/target/*.jar"
          target: "/home/${{ secrets.GCP_VM_USER }}/app/"

      - name: Deploy and run application
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            echo "Reiniciando a VM para aplicar alterações..."
            nohup sudo reboot &
